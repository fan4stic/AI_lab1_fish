seed: 42

data:
  path: data/fish_participant.csv
  target: Weight
  # Length1/Length2 почти дубли Length3 (corr > 0.99),
  # поэтому в базовом наборе оставляем Length3, Height, Width + Species.
  numeric_features:
    - Length3
    - Height
    - Width
  categorical_features:
    - Species

split:
  test_size: 0.2
  random_state: 42
  n_splits: 5

mlflow:
  experiment_name: fishgrow-lab02
  tracking_uri: mlruns

models:
  e1_linear:
    fit_intercept: true

  e2_ridge:
    alphas: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]

  e3_gb:
    max_iter: [200, 400]
    learning_rate: [0.05, 0.1]
    max_depth: [3, 5]